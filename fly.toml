app = "instaflow-saas"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

[env]
  APP_TZ = "America/Sao_Paulo"
  MAX_UPLOAD_MB = "500"
  POSTING_WORKERS = "8"
  CODE_TIMEOUT = "180"
  PORT = "8000"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[mounts]]
  source = "instaflow_data"
  destination = "/app/data"
  initial_size = "10gb"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
