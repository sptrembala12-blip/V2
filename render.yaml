services:
  - type: web
    name: instaflow-saas
    env: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: python run.py
    envVars:
      - key: PORT
        value: 8000
      - key: APP_TZ
        value: America/Sao_Paulo
      - key: MAX_UPLOAD_MB
        value: 500
      - key: POSTING_WORKERS
        value: 8
      - key: CODE_TIMEOUT
        value: 180
